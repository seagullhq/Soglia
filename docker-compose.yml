# Dokploy deployment: Traefik terminates TLS, the API serves HTTP on :8080.
# In Dokploy's Environment tab set SOGLIA_PASSWORD, POSTGRES_PASSWORD and SOGLIA_USER.
# Upload the v6 model to ../files/v6 relative to this compose file
# (the service's "files" directory) before the first deploy.

name: soglia

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soglia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy}
      POSTGRES_DB: soglia
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soglia -d soglia"]
      interval: 5s
      timeout: 3s
      retries: 20

  # TEMPORARY: remove this service once the model has been uploaded.
  # It only exists so Dokploy's Docker -> Containers -> Browse Files UI can
  # write into ../files/v6 without SSH access to the host.
  uploader:
    image: docker.io/library/busybox:1.36
    restart: "no"
    command: ["sleep", "infinity"]
    volumes:
      - ../files/v6:/srv/v6

  api:
    build:
      context: .
      dockerfile: api/Dockerfile.dokploy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SOGLIA_USER: ${SOGLIA_USER:-admin}
      SOGLIA_PASSWORD: ${SOGLIA_PASSWORD:?set SOGLIA_PASSWORD in Dokploy}
      SOGLIA_DATABASE_URL: postgres://soglia:${POSTGRES_PASSWORD}@postgres:5432/soglia?sslmode=disable
      SOGLIA_SETTINGS: /app/settings/settings.json
    expose:
      - "8080"
    volumes:
      - ../files/v6:/app/v6:ro
      - soglia-settings:/app/settings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pg-data:
  soglia-settings:
